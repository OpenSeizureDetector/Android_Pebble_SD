<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1626">
  <title>Open Seizure Detector</title>

  <!-- Same scripts as before: osd_main.js is unchanged and drives everything below by element id. -->
  <script src="js/jquery.js"></script>
  <script src="js/jBeep.js"></script>
  <script src="js/Chart.min.js"></script>
  <script src="js/osd_main.js"></script>
  <script src="js/osd_logs.js"></script>

  <!--
    The CSS is inline on purpose: SdWebServer.serveFile() sends every file as text/html,
    and browsers in standards mode refuse external stylesheets with that MIME type.
  -->
  <style>
    :root {
      --ink: #0d1626;
      --panel: #15223a;
      --line: #2a3b5c;
      --text: #e9eef7;
      --muted: #93a3bf;

      --ok: #3cc7b0;     --ok-soft: rgba(60, 199, 176, .13);
      --warn: #f2a93b;   --warn-soft: rgba(242, 169, 59, .15);
      --alarm: #ff5d5d;  --alarm-soft: rgba(255, 93, 93, .17);
      --idle: #7a8aa8;   --idle-soft: rgba(122, 138, 168, .14);

      --font: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink);
      color: var(--text);
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.45;
    }

    #home {
      max-width: 46rem;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
    }

    /* ---------- header ---------- */
    #header {
      display: flex;
      align-items: center;
      gap: .8rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    #header img { width: 2.5rem; height: 2.5rem; border-radius: .6rem; }
    #header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .01em;
      color: var(--muted);
    }

    /*
      osd_main.js colours these elements by setting an inline background-color
      (blue = ok, orange = warning, red = alarm). The rules below read that value
      and turn it into a state colour (--c / --cs), then override the inline
      background itself with !important.
    */
    #benStat, .tile { --c: var(--idle); --cs: var(--idle-soft); }

    #benStat[style*="blue"],   .tile[style*="blue"]   { --c: var(--ok);    --cs: var(--ok-soft); }
    #benStat[style*="orange"], .tile[style*="orange"] { --c: var(--warn);  --cs: var(--warn-soft); }
    #benStat[style*="red"],    .tile[style*="red"]    { --c: var(--alarm); --cs: var(--alarm-soft); }

    /* ---------- main status: the beacon ---------- */
    #benStat {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      padding: 2rem 1.6rem;
      margin-bottom: .6rem;
      border: 1px solid var(--c);
      border-radius: 1.4rem;
      background: var(--cs) !important;
      font-size: clamp(1.3rem, 4.6vw, 2rem);
      font-weight: 650;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    #benStat::before {
      content: "";
      flex: none;
      width: 3.6rem;
      height: 3.6rem;
      border-radius: 50%;
      background: radial-gradient(circle, var(--c) 0 36%, transparent 38%);
      box-shadow: inset 0 0 0 2px var(--c), 0 0 0 .4rem var(--cs);
      animation: breathe 5s ease-in-out infinite;
    }
    #benStat[style*="orange"]::before { animation-duration: 2.6s; }
    #benStat[style*="red"]::before    { animation-duration: 1.8s; }

    /* Alarm: solid fill so it cannot be missed. The motion is a slow swell, never a flash. */
    #benStat[style*="red"] {
      background: var(--alarm) !important;
      border-color: var(--alarm);
      color: #230707;
    }
    #benStat[style*="red"]::before {
      --c: #230707;
      --cs: rgba(35, 7, 7, .22);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1);    opacity: .8; }
      50%      { transform: scale(1.12); opacity: 1;  }
    }

    /* ---------- device tiles ---------- */
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: .75rem;
      margin-bottom: 1.75rem;
    }
    .tile {
      padding: 1rem 1.1rem;
      border: 1px solid var(--line);
      border-left: .4rem solid var(--c);
      border-radius: .9rem;
      background: var(--panel) !important;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }
    .tile[style*="red"] { background: var(--alarm-soft) !important; border-color: var(--alarm); }

    /* ---------- alarm types: one small icon per enabled detector ---------- */
    #alarmTypes { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin: 0 0 1rem; }
    #alarmTypes:empty { display: none; }
    .atype {
      display: flex; flex-direction: column; align-items: center; gap: .2rem;
      min-width: 4.2rem; padding: .5rem .6rem;
      border: 1px solid var(--line); border-radius: .8rem;
      background: var(--panel); color: var(--muted);
      font-size: .72rem; line-height: 1.2; text-align: center;
    }
    .atype svg {
      width: 1.7rem; height: 1.7rem; fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .atype text { fill: currentColor; stroke: none; }
    .atype.lv0 { color: var(--ok); }                                   /* enabled, quiet */
    .atype.lv1 { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
    .atype.lv2 { color: #230707; background: var(--alarm); border-color: var(--alarm);
                 font-weight: 650; animation: breathe 1.8s ease-in-out infinite; }

    /* status text: phrase on the first line, time of the reading below it */
    .stxt .stime { margin-top: .3rem; font-size: .55em; font-weight: 500; opacity: .85; font-variant-numeric: tabular-nums; }

    /* ---------- browser mute button (full width, last item of the tile grid) ---------- */
    #muteButton {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem;
      min-height: 3.6rem; padding: .6rem 1.2rem;
      border: 1px solid var(--line); border-radius: .9rem;
      background: var(--panel); color: var(--text);
      font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    #muteButton small { font-size: .78rem; font-weight: 400; color: var(--muted); }
    #muteButton:hover { border-color: var(--muted); }
    #muteButton.muted { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); font-variant-numeric: tabular-nums; }
    #muteButton.muted small { color: var(--text); }

    a:focus-visible, button:focus-visible { outline: 3px solid var(--warn); outline-offset: 3px; }

    /* ---------- footer ---------- */
    #footer { margin-top: 2.5rem; font-size: .95rem; }
    #footer a { color: var(--muted); text-underline-offset: .2em; }
    #footer a:hover { color: var(--text); }
    #debugInfo { margin-top: .5rem; color: var(--muted); font-size: .85rem; }

    @media (prefers-reduced-motion: reduce) {
      #benStat::before, .atype { animation: none !important; }
    }
  </style>
</head>

<body>
  <div id="home">

    <div id="header">
      <img src="img/icon_48x48.png" alt="">
      <h1>Open Seizure Detector</h1>
    </div>

    <div role="main">
      <!-- Shows neutral grey until the first reading arrives, instead of a reassuring "OK". -->
      <div id="benStat">Waiting for data from the phone…</div>
      <div id="alarmTypes"></div>

      <div class="tiles">
        <!-- Hidden while the watch is fine; osd_main.js shows them in red only when something is wrong. -->
        <div id="pebStat1" class="tile" style="display:none"></div>
        <div id="pebStat2" class="tile" style="display:none"></div>
        <div id="pebStat3" class="tile">Watch battery…</div>
        <div id="pebStat4" class="tile">Watch signal…</div>
        <div id="pebStat5" class="tile">Phone battery…</div>
        <button id="muteButton" type="button">Mute alarm sound<small>for 10 minutes</small></button>
      </div>
    </div>

    <div id="footer">
      <a href="logfiles.html">View log files</a>
      <div id="debugInfo"></div>
    </div>

  </div>
</body>

</html>
